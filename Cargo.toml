[package]
name = "omnifocus-tui"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A standalone terminal UI for OmniFocus, with optional Herdr integration"
license = "MIT"
repository = "https://github.com/Tomyail/omnifocus-tui"
authors = ["Tomyail"]
keywords = ["omnifocus", "tui", "ratatui", "terminal", "tasks"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

[profile.release]
strip = true
lto = "thin"
