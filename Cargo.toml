[package]
name = "omnifocus-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A standalone terminal UI for OmniFocus, with optional Herdr integration"
license = "MIT"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
