id = "omnifocus-tui"
name = "omnifocus-tui"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "OmniFocus tasks in a popup pane."
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open OmniFocus"
description = "Open the OmniFocus TUI in a popup pane"
contexts = ["global"]
command = [
  "herdr",
  "plugin",
  "pane",
  "open",
  "--plugin",
  "omnifocus-tui",
  "--entrypoint",
  "app",
  "--focus",
]

[[panes]]
id = "app"
title = "OmniFocus"
placement = "popup"
width = "100%"
height = "100%"
command = ["bash", "run.sh"]
